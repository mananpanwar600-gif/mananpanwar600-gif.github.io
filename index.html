<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manan Singh Panwar | AI/ML & GenAI Developer</title>
<meta name="description" content="Portfolio of Manan Singh Panwar, B.Tech CSE (AI & ML) student at UPES Dehradun building GenAI, RAG and computer vision applications.">
<meta property="og:title" content="Manan Singh Panwar | AI/ML & GenAI Developer">
<meta property="og:description" content="Projects and experience in AI, ML and Generative AI.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b1020'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='%234f8cff' font-family='sans-serif' font-weight='700'>M</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<header class="nav">
  <a href="#home" class="logo">MSP</a>
  <button class="burger" id="burger" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button>
  <nav id="menu"></nav>
  <span class="indicator" id="indicator"></span>
</header>

<main>
<section id="home" class="hero">
  <div class="hero-text">
    <p class="muted">Hi, I'm</p>
    <h1 id="name"></h1>
    <p class="typing"><span id="typed"></span><i class="caret"></i></p>
    <p class="lead" id="intro"></p>
    <div class="hero-stats" id="heroStats"></div>
    <div class="btns">
      <a href="#projects" class="btn primary">View Projects</a>
      <a href="#contact" class="btn">Contact Me</a>
    </div>
    <div class="socials" id="heroSocials"></div>
  </div>
  <div class="avatar"><img id="avatar" alt="Profile photo of Manan Singh Panwar"></div>
</section>

<section id="about"><h2>About me</h2><div class="about"><div id="aboutText"></div><a class="btn primary" id="resumeBtn" download>Download resume</a></div></section>
<section id="education"><h2>Education</h2><div class="timeline" id="educationList"></div></section>
<section id="experience"><h2>Experience</h2><div class="timeline" id="experienceList"></div></section>
<section id="projects"><h2>Projects</h2><div class="grid" id="projectList"></div></section>
<section id="hackathons"><h2>Hackathons</h2><div class="grid" id="hackathonList"></div></section>
<section id="achievements"><h2>Achievements</h2><div class="grid" id="achievementList"></div></section>
<section id="certificates"><h2>Certificates</h2><div class="grid" id="certificateList"></div></section>
<section id="skills"><h2>Skills</h2><div class="skills" id="skillList"></div></section>

<section id="contact"><h2>Contact</h2>
  <div class="contact">
    <div class="card" id="contactInfo"></div>
    <!-- To make this form work, see README "Connect the contact form" -->
    <form class="card" id="form" method="POST">
      <label>Name<input name="name" required></label>
      <label>Email<input name="email" type="email" required></label>
      <label>Message<textarea name="message" rows="5" required></textarea></label>
      <button class="btn primary" type="submit">Send message</button>
      <p class="muted" id="formNote"></p>
    </form>
  </div>
</section>
</main>
<footer>© <span id="year"></span> Manan Singh Panwar</footer>
<script src="script.js"></script>
</body>
</html>
